<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LongkaliVerse</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:Arial}
  /* ✅ MENU ATAS - UDAH GUE KUNCI BIAR GAK PINDAH-PINDAH LAGI */
  #ui{position:fixed;top:0;left:0;right:0;background:#111;color:#fff;padding:8px;text-align:center;z-index:10;font-size:14px}
  #ui button{padding:5px 10px;border-radius:8px;border:none;font-weight:bold}
  /* ✅ KTP - DI TENGAH, MUNCUL KALAU DIPENCET */
  #ktp{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:20px;border-radius:15px;z-index:99;width:280px;text-align:left}
  /* ✅ MENU BAWAH - MAP + JALAN-JALAN */
  #menuBawah{position:fixed;bottom:15px;right:15px;z-index:10;display:flex;gap:8px}
  #menuBawah button{padding:10px 14px;border-radius:12px;border:none;background:#fff;font-weight:bold}
  /* ✅ JOYSTICK - KIRI BAWAH, BUAT JALAN-JALAN DI HP */
  #joy{position:fixed;bottom:20px;left:20px;width:110px;height:110px;background:rgba(255,255,255,0.25);border-radius:50%;z-index:10}
  #stick{position:absolute;left:35px;top:35px;width:40px;height:40px;background:#fff;border-radius:50%}
</style>
</head>
<body>

<div id="ui">
  Selamat datang di LongkaliVerse!<br>
  💰 <span id="uangBar">Rp 0</span> | Warga: 4.000 |
  <button onclick="bukaKTP()">📇 KTP</button>
  <button onclick="lihatMap()">🗺️ MAP</button>
</div>

<div id="ktp">
  <h3 style="margin:0">KTP LONGKALI</h3>
  <p><b>Nama:</b> KHOIRUL HILMI</p>
  <p><b>NIK:</b> 6402010908000001</p>
  <p><b>Alamat:</b> Jl. Longkali RT 01</p>
  <p><b>Saldo:</b> <span id="ktpUang">Rp 0</span></p>
  <button onclick="tutupKTP()" style="padding:8px 15px">Tutup</button>
</div>

<!-- MENU BAWAH -->
<div id="menuBawah">
  <button onclick="modeJalan()">🚶 JALAN-JALAN</button>
</div>

<!-- JOYSTICK -->
<div id="joy"><div id="stick"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
camera.position.set(0, 20, 25);
camera.lookAt(0,0,0);

let tanah = new THREE.Mesh(new THREE.PlaneGeometry(110,110), new THREE.MeshBasicMaterial({color:0x2ea043}));
tanah.rotation.x = -Math.PI/2;
scene.add(tanah);

// =======================================================
// ✅ BOLEH DIUBAH DI SINI AJA
// =======================================================
let UANG = 0;
let DAFTAR_NPC = [
  { nama:'Pak RT', warna:0x3b82f6, x:-10, z:-10 },
  { nama:'Bu Sari', warna:0xf59e0b, x:10, z:10 },
  { nama:'Bang Udin', warna:0xef4444, x:0, z:-15 },
];

// ❌ MAU HAPUS JALAN? HAPUS 2 BARIS DI BAWAH INI AJA
// buatJalan(-30,0,30,0);
// buatJalan(0,-30,0,30);
// 👆 UDAH GUE MATIIN DULUAN PAKE // JADI JALAN UDAH HILANG

// =======================================================
// ❌ JANGAN DIUBAH DARI SINI KE BAWAH
// =======================================================
function updateUang(){
  document.getElementById('uangBar').innerText = 'Rp ' + UANG.toLocaleString('id-ID');
  document.getElementById('ktpUang').innerText = 'Rp ' + UANG.toLocaleString('id-ID');
}
updateUang();
function bukaKTP(){ document.getElementById('ktp').style.display='block'; }
function tutupKTP(){ document.getElementById('ktp').style.display='none'; }
function lihatMap(){ camera.position.set(0,60,0); camera.lookAt(0,0,0); }
function modeJalan(){ camera.position.set(saya.position.x, 8, saya.position.z+12); camera.lookAt(saya.position.x, 2, saya.position.z); alert('Mode Jalan-Jalan Aktif! Geser joystick kiri bawah buat jalan'); }

function buatJalan(x1,z1,x2,z2){
  let len = Math.hypot(x2-x1, z2-z1);
  let jln = new THREE.Mesh(new THREE.PlaneGeometry(len, 6), new THREE.MeshBasicMaterial({color:0x333333}));
  jln.rotation.x = -Math.PI/2; jln.rotation.z = -Math.atan2(z2-z1, x2-x1);
  jln.position.set((x1+x2)/2, 0.1, (z1+z2)/2); scene.add(jln);
}
function buatOrang(warna, x, z){
  let b = new THREE.Mesh(new THREE.BoxGeometry(1,2,1), new THREE.MeshBasicMaterial({color:warna}));
  b.position.set(x,1,z); scene.add(b); return b;
}
DAFTAR_NPC.forEach(npc => { buatOrang(npc.warna, npc.x, npc.z); });
let saya = buatOrang(0x22ff22, 0, 5);

// JOYSTICK BUAT HP - INI YANG KEMAREN HILANG
let joyX=0, joyY=0, jalanAktif=false;
let joy = document.getElementById('joy');
let stick = document.getElementById('stick');
joy.addEventListener('touchmove', e=>{
  let r = joy.getBoundingClientRect();
  let t = e.touches[0];
  joyX = (t.clientX - r.left - 55)/55;
  joyY = (t.clientY - r.top - 55)/55;
  stick.style.left = (35 + joyX*25)+'px';
  stick.style.top = (35 + joyY*25)+'px';
  jalanAktif = true;
});
joy.addEventListener('touchend', ()=>{ joyX=0; joyY=0; stick.style.left='35px'; stick.style.top='35px'; });

function animasi(){
  requestAnimationFrame(animasi);
  if(jalanAktif){
    saya.position.x += joyX * 0.3;
    saya.position.z += joyY * 0.3;
    camera.position.set(saya.position.x, 20, saya.position.z+25);
    camera.lookAt(saya.position.x, 0, saya.position.z);
  }
  renderer.render(scene, camera);
}
animasi();

// Keyboard buat laptop tetap bisa
document.addEventListener('keydown', e=>{
  if(e.key=='w') saya.position.z -= 0.5;
  if(e.key=='s') saya.position.z += 0.5;
  if(e.key=='a') saya.position.x -= 0.5;
  if(e.key=='d') saya.position.x += 0.5;
});
</script>
</body>
</html>
