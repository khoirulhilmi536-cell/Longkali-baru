<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ADMIN LONGKALI - Jalan di Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#000;font-family:Arial;color:#fff}
#game{position:fixed;inset:0}
#top{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.9);padding:8px;display:flex;gap:5px;flex-wrap:wrap;z-index:10;align-items:center}
#top b{color:#facc15;font-size:13px;width:100%}
button,select,input{padding:8px 10px;border-radius:8px;border:none;font-weight:700;font-size:13px}
button{background:#22c55e;color:#fff}button.del{background:#ef4444}button.blue{background:#3b82f6}button.yellow{background:#eab308;color:#000}button.active{outline:3px solid #facc15}
#panel{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);padding:10px;z-index:10;max-height:32vh;overflow:auto}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.row label{font-size:12px;color:#ccc}
#joy{position:fixed;left:15px;bottom:340px;width:110px;height:110px;background:rgba(255,255,255,.2);border:2px solid #fff;border-radius:50%;z-index:99}
#stick{position:absolute;left:35px;top:35px;width:40px;height:40px;background:#fff;border-radius:50%}
#look{position:fixed;right:15px;bottom:340px;width:110px;height:110px;background:rgba(255,255,255,.15);border:2px solid #fff;border-radius:50%;z-index:99}
#lookBtn{position:absolute;left:35px;top:35px;width:40px;height:40px;background:#facc15;border-radius:50%}
#info{position:fixed;top:95px;left:10px;background:rgba(0,0,0,.7);padding:8px;border-radius:8px;font-size:12px;z-index:9}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;z-index:8;pointer-events:none}
</style></head>
<body>
<div id="game"></div>
<div id="cross">+</div>
<div id="info">📍 X:0 Z:0 | Objek: <span id="cnt">0</span><br><span id="selInfo">Belum ada yang dipilih</span></div>

<div id="top">
<b>🏙️ ADMIN LONGKALI - MODE JALAN | DB: admin-55bc3 ✅</b>
<button onclick="setMode('jalan')" id="bJalan" class="active">🚶 JALAN</button>
<button onclick="setMode('terbang')" id="bTerbang">✈️ TERBANG</button>
<button onclick="setMode('edit')" id="bEdit" class="yellow">✏️ EDIT / PILIH</button>
<button onclick="simpan()" style="background:#f97316">💾 SIMPAN KE GAME</button>
</div>

<div id="panel">
<div class="row">
<label>Tambah:</label>
<select id="tipe"><option value="rumah">🏠 Rumah (ada pintu)</option><option value="toko">🏪 Toko</option><option value="pohon">🌲 Pohon</option><option value="jalan">🛣️ Jalan</option><option value="lampu">💡 Lampu</option><option value="npc">🧍 NPC</option></select>
<input id="nama" placeholder="Nama (untuk NPC/Toko)" style="flex:1">
<button onclick="tambahDiDepan()">➕ TARUH DI DEPAN SAYA</button>
</div>
<div class="row">
<label>Warna:</label><input type="color" id="warna" value="#ffffff">
<label>Atap:</label><input type="color" id="atap" value="#dc2626">
<label>Scale:</label><input type="range" id="scale" min="0.5" max="4" step="0.1" value="1"><span id="scaleVal">1</span>
<label>Putar:</label><button onclick="putar(-45)">↩️</button><button onclick="putar(45)">↪️</button>
</div>
<div class="row">
<label>Geser yang dipilih:</label>
<button onclick="geser(0,-1)">⬆️</button><button onclick="geser(0,1)">⬇️</button><button onclick="geser(-1,0)">⬅️</button><button onclick="geser(1,0)">➡️</button>
<button onclick="hapusPilih()" class="del">🗑️ HAPUS</button>
<button onclick="loadMap()" class="blue">🔄 MUAT ULANG</button>
<button onclick="hapusSemua()" class="del">⚠️ HAPUS SEMUA</button>
</div>
<div class="row" style="font-size:11px;color:#aaa">Cara pakai: Mode JALAN = jalan pake joystick/WASD. Mode EDIT = klik objek buat pilih, lalu geser/puter/hapus. Mode TERBANG = kamera naik. Klik SIMPAN kalo udah selesai!</div>
</div>

<div id="joy"><div id="stick"></div></div>
<div id="look"><div id="lookBtn"></div></div>

<script>
const DB_URL = "https://admin-55bc3-default-rtdb.firebaseio.com";
let scene,camera,renderer,player={x:0,z:0,rot:0,y:2},keys={},objs=[],selected=null,mode='jalan',joyX=0,joyY=0;

function init(){
scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb); scene.fog=new THREE.Fog(0x87ceeb,80,300);
camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.9));
let sun=new THREE.DirectionalLight(0xffffff,0.8); sun.position.set(50,100,50); scene.add(sun);
let g=new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshLambertMaterial({color:0x4ade80})); g.rotation.x=-Math.PI/2; scene.add(g);
let grid=new THREE.GridHelper(500,50,0x000000,0x000000); grid.material.transparent=true; grid.material.opacity=0.1; scene.add(grid);
for(let i=-200;i<=200;i+=10){let j=new THREE.Mesh(new THREE.BoxGeometry(10,0.1,10), new THREE.MeshLambertMaterial({color:0x334155})); j.position.set(i,0.05,0); scene.add(j);}
loadMap(); setupInput(); animate();
}
function buatObj(o){
let s=o.scale||1,x=o.x||0,z=o.z||0,cW=o.warna?parseInt(o.warna.replace('#','0x')):0xffffff,cA=o.atap?parseInt(o.atap.replace('#','0x')):0xdc2626;
let grp=new THREE.Group();
if(o.type=='rumah'||o.type=='toko'){
let d=new THREE.Mesh(new THREE.BoxGeometry(8*s,5*s,8*s), new THREE.MeshLambertMaterial({color:cW})); d.position.y=2.5*s; grp.add(d);
let at=new THREE.Mesh(new THREE.ConeGeometry(6.5*s,3*s,4), new THREE.MeshLambertMaterial({color:cA})); at.position.y=6.5*s; at.rotation.y=Math.PI/4; grp.add(at);
let p=new THREE.Mesh(new THREE.BoxGeometry(1.6*s,2.8*s,0.2), new THREE.MeshLambertMaterial({color:0x8B4513})); p.position.set(0,1.4*s,4.1*s); grp.add(p);
let j1=new THREE.Mesh(new THREE.BoxGeometry(1.5*s,1.2*s,0.2), new THREE.MeshLambertMaterial({color:0x87CEEB})); j1.position.set(-2.2*s,2.8*s,4.1*s); grp.add(j1);
let j2=j1.clone(); j2.position.x=2.2*s; grp.add(j2);
}else if(o.type=='pohon'){
let b=new THREE.Mesh(new THREE.CylinderGeometry(0.5*s,0.5*s,3*s,6), new THREE.MeshLambertMaterial({color:0x78350f})); b.position.y=1.5*s; grp.add(b);
let d=new THREE.Mesh(new THREE.ConeGeometry(2.8*s,6*s,6), new THREE.MeshLambertMaterial({color:cW})); d.position.y=6*s; grp.add(d);
}else if(o.type=='jalan'){
let j=new THREE.Mesh(new THREE.BoxGeometry(10*s,0.2,10*s), new THREE.MeshLambertMaterial({color:0x334155})); j.position.y=0.1; grp.add(j);
}else if(o.type=='lampu'){
let t=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,6*s,6), new THREE.MeshLambertMaterial({color:0x333333})); t.position.y=3*s; grp.add(t);
let l=new THREE.Mesh(new THREE.SphereGeometry(0.8*s,8,8), new THREE.MeshBasicMaterial({color:0xfde047})); l.position.y=6.2*s; grp.add(l);
}else{
let b=new THREE.Mesh(new THREE.BoxGeometry(1,2.2,0.8), new THREE.MeshLambertMaterial({color:cW})); b.position.y=1.1; grp.add(b);
let k=new THREE.Mesh(new THREE.SphereGeometry(0.45,10,10), new THREE.MeshLambertMaterial({color:0xfdbd8a})); k.position.y=2.6; grp.add(k);
}
grp.position.set(x,0,z); grp.rotation.y=(o.rot||0)*Math.PI/180; grp.userData.data=o; scene.add(grp); objs.push(grp); updateCnt(); return grp;
}
function updateCnt(){document.getElementById('cnt').innerText=objs.length;}
async function loadMap(){
objs.forEach(o=>scene.remove(o)); objs=[]; selected=null;
try{let r=await fetch(DB_URL+"/map.json"); let d=await r.json(); let arr=Array.isArray(d)?d:Object.values(d||{}); arr.forEach(o=>{if(o&&o.x!=null) buatObj(o);});}catch(e){alert('Gagal load map, cek DB_URL');}
}
async function simpan(){
let arr=objs.map(g=>g.userData.data);
try{await fetch(DB_URL+"/map.json",{method:"PUT",body:JSON.stringify(arr)}); alert('✅ TERSIMPAN! '+arr.length+' objek udah masuk game!');}catch(e){alert('Gagal simpan! Cek DB_URL');}
}
function tambahDiDepan(){
let depanX=player.x+Math.sin(player.rot)*8, depanZ=player.z+Math.cos(player.rot)*8;
let o={type:document.getElementById('tipe').value, x:Math.round(depanX), z:Math.round(depanZ), scale:parseFloat(document.getElementById('scale').value), warna:document.getElementById('warna').value, atap:document.getElementById('atap').value, rot:0, nama:document.getElementById('nama').value||''};
let g=buatObj(o); pilih(g);
}
function pilih(g){
if(selected) selected.children.forEach(c=>{if(c.material&&c.material.emissive) c.material.emissive.setHex(0x000000)});
selected=g; if(!g){document.getElementById('selInfo').innerText='Belum ada yang dipilih';return;}
g.children.forEach(c=>{if(c.material&&c.material.emissive) c.material.emissive.setHex(0x333333)});
let d=g.userData.data; document.getElementById('selInfo').innerText='Dipilih: '+d.type+' | X:'+d.x+' Z:'+d.z+' | '+ (d.nama||'');
document.getElementById('warna').value=d.warna||'#ffffff'; document.getElementById('atap').value=d.atap||'#dc2626';
}
function geser(dx,dz){if(!selected) return alert('Pilih dulu objeknya! Mode EDIT lalu klik objek'); let d=selected.userData.data; d.x+=dx; d.z+=dz; selected.position.x=d.x; selected.position.z=d.z; pilih(selected);}
function putar(a){if(!selected) return alert('Pilih dulu!'); let d=selected.userData.data; d.rot=(d.rot||0)+a; selected.rotation.y=d.rot*Math.PI/180; pilih(selected);}
function hapusPilih(){if(!selected) return; scene.remove(selected); objs=objs.filter(o=>o!==selected); selected=null; updateCnt(); document.getElementById('selInfo').innerText='Dihapus';}
function hapusSemua(){if(!confirm('Hapus SEMUA objek?'))return; objs.forEach(o=>scene.remove(o)); objs=[]; selected=null; updateCnt();}
function setMode(m){mode=m; ['bJalan','bTerbang','bEdit'].forEach(id=>document.getElementById(id).classList.remove('active')); document.getElementById(m=='jalan'?'bJalan':m=='terbang'?'bTerbang':'bEdit').classList.add('active');}
document.getElementById('scale').oninput=e=>{document.getElementById('scaleVal').innerText=e.target.value; if(selected){selected.userData.data.scale=parseFloat(e.target.value); let d=selected.userData.data; scene.remove(selected); objs=objs.filter(o=>o!==selected); let ng=buatObj(d); pilih(ng);}};
document.getElementById('warna').onchange=e=>{if(selected){selected.userData.data.warna=e.target.value; let d=selected.userData.data; scene.remove(selected); objs=objs.filter(o=>o!==selected); pilih(buatObj(d));}};
function setupInput(){
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true); addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
renderer.domElement.addEventListener('click',()=>{
if(mode!=='edit') return;
let ray=new THREE.Raycaster(); ray.setFromCamera(new THREE.Vector2(0,0),camera);
let hits=ray.intersectObjects(objs,true); if(hits.length){let g=hits[0].object; while(g.parent&&!objs.includes(g)) g=g.parent; pilih(g);} else pilih(null);
});
let joy=document.getElementById('joy'),stick=document.getElementById('stick'),dragJ=false;
joy.addEventListener('touchstart',e=>dragJ=true); joy.addEventListener('touchmove',e=>{if(!dragJ)return; let t=e.touches[0],r=joy.getBoundingClientRect(); joyX=(t.clientX-(r.left+55))/40; joyY=(t.clientY-(r.top+55))/40; joyX=Math.max(-1,Math.min(1,joyX)); joyY=Math.max(-1,Math.min(1,joyY)); stick.style.left=(35+joyX*30)+'px'; stick.style.top=(35+joyY*30)+'px';}); joy.addEventListener('touchend',()=>{dragJ=false; joyX=joyY=0; stick.style.left='35px'; stick.style.top='35px';});
let look=document.getElementById('look'),dragL=false,lastX=0,lastY=0;
look.addEventListener('touchstart',e=>{dragL=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;});
look.addEventListener('touchmove',e=>{if(!dragL)return; let t=e.touches[0]; player.rot-=(t.clientX-lastX)*0.01; player.y=Math.max(1,Math.min(20,player.y+(t.clientY-lastY)*0.02)); lastX=t.clientX; lastY=t.clientY;});
look.addEventListener('touchend',()=>dragL=false);
let md=false,lx=0,ly=0; renderer.domElement.addEventListener('mousedown',e=>{md=true; lx=e.clientX; ly=e.clientY;}); addEventListener('mousemove',e=>{if(!md)return; player.rot-=(e.clientX-lx)*0.01; player.y=Math.max(1,Math.min(30,player.y+(e.clientY-ly)*0.02)); lx=e.clientX; ly=e.clientY;}); addEventListener('mouseup',()=>md=false);
}
function animate(){
requestAnimationFrame(animate);
let sp=mode=='terbang'?1.2:0.35, mx=0,mz=0;
if(keys['w']||keys['arrowup']) mz+=1; if(keys['s']||keys['arrowdown']) mz-=1; if(keys['a']||keys['arrowleft']) mx-=1; if(keys['d']||keys['arrowright']) mx+=1;
mx+=joyX; mz+=-joyY;
if(mx||mz){let len=Math.hypot(mx,mz); mx/=len; mz/=len; let sin=Math.sin(player.rot),cos=Math.cos(player.rot); player.x+=(mx*cos+mz*sin)*sp; player.z+=(-mx*sin+mz*cos)*sp;}
if(mode=='terbang'){ if(keys[' ']) player.y+=0.5; if(keys['shift']) player.y-=0.5; }
else player.y=2;
camera.position.set(player.x,player.y,player.z); camera.rotation.set(0,player.rot,0); camera.rotation.order='YXZ'; camera.rotation.y=player.rot; camera.rotation.x=-0.1;
document.getElementById('info').innerHTML='📍 X:'+Math.round(player.x)+' Z:'+Math.round(player.z)+' | Objek: '+objs.length+'<br><span id="selInfo">'+document.getElementById('selInfo').innerText+'</span>';
renderer.render(scene,camera);
}
init();
</script></body></html>
