<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin LongkaliVerse V3</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0f172a;color:#fff;padding:14px}
h1{margin:0 0 4px;font-size:22px}h1 span{font-size:11px;background:#f59e0b;color:#000;padding:3px 7px;border-radius:6px}
p{color:#94a3b8;font-size:12px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:none;border-radius:12px;font-weight:900;font-size:14px;background:#1e293b;color:#fff}
.tabs button.active{background:#f59e0b;color:#000}
.card{background:#fff;color:#000;border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px}
label{font-size:12px;font-weight:800;color:#475569}
input,select{width:100%;padding:11px;border:2px solid #cbd5e1;border-radius:10px;font-size:14px;margin:4px 0 10px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:900;font-size:14px;margin-top:6px}
.btnUtama{background:#0e4a5a;color:#fff}.btnKuning{background:#f59e0b;color:#000}.btnMerah{background:#dc2626;color:#fff}.btnAbu{background:#e2e8f0}
.item{background:#f1f5f9;border-radius:12px;padding:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.item b{font-size:14px}.item small{color:#64748b}
.item button{padding:8px 12px;border:none;border-radius:10px;font-weight:900}
.box{ background:#fef3c7;color:#92400e;padding:10px;border-radius:10px;font-size:12px;font-weight:700;margin-bottom:12px}
</style>
</head>
<body>
<h1>Admin LongkaliVerse <span>V3</span></h1>
<p>Geser Jalan + Bangunan • Langsung masuk ke game</p>

<div class="tabs">
<button id="tabMap" class="active" onclick="showTab('map')">🏠 MAP / BANGUNAN</button>
<button id="tabJalan" onclick="showTab('jalan')">🛣️ JALAN</button>
</div>

<div class="box">⚠️ Abis SIMPAN, buka game-nya terus REFRESH. Jalan / bangunan baru langsung muncul.</div>

<!-- TAB MAP -->
<div id="pageMap">
<div class="card">
<h3>➕ Tambah Bangunan</h3>
<label>Nama Bangunan</label>
<input id="namaMap" placeholder="Contoh: Warung Bu Sari">
<label>Tipe</label>
<select id="typeMap">
<option value="rumah">🏠 Rumah</option>
<option value="toko">🛒 Toko / Warung</option>
<option value="masjid">🕌 Masjid</option>
<option value="pos">🚨 Pos Ronda</option>
<option value="lain">🏠 Bangunan Lain</option>
</select>
<label>Posisi X (-230 sampai 230)</label>
<input id="xMap" type="number" value="50">
<label>Posisi Z (-230 sampai 230)</label>
<input id="zMap" type="number" value="50">
<button class="btn btnUtama" onclick="tambahMap()">✅ SIMPAN BANGUNAN</button>
</div>
<div class="card">
<h3>📋 Daftar Bangunan Admin</h3>
<div id="listMap">Loading...</div>
</div>
</div>

<!-- TAB JALAN -->
<div id="pageJalan" style="display:none">
<div class="card">
<h3>➕ Tambah / Edit Jalan</h3>
<label>Posisi X</label>
<input id="xJalan" type="number" value="0">
<label>Posisi Z</label>
<input id="zJalan" type="number" value="0">
<label>Panjang</label>
<input id="panjangJalan" type="number" value="500">
<label>Lebar</label>
<input id="lebarJalan" type="number" value="10">
<label>Arah</label>
<select id="arahJalan">
<option value="horizontal">↔️ Horizontal (kiri-kanan)</option>
<option value="vertical">↕️ Vertical (atas-bawah)</option>
</select>
<button class="btn btnKuning" onclick="tambahJalan()">✅ SIMPAN JALAN</button>
<button class="btn btnAbu" onclick="resetJalan()">🔄 Reset ke Jalan Default (Salib)</button>
</div>
<div class="card">
<h3>📋 Daftar Jalan</h3>
<div id="listJalan">Loading...</div>
</div>
</div>

<script>
var DB_URL="https://admin-55bc3-default-rtdb.firebaseio.com";
function showTab(t){
  document.getElementById('pageMap').style.display = t=='map'?'block':'none';
  document.getElementById('pageJalan').style.display = t=='jalan'?'block':'none';
  document.getElementById('tabMap').classList.toggle('active',t=='map');
  document.getElementById('tabJalan').classList.toggle('active',t=='jalan');
  if(t=='map') loadMap(); else loadJalan();
}
// ===== MAP =====
async function loadMap(){
  document.getElementById('listMap').innerHTML='Loading...';
  try{
    let r=await fetch(DB_URL+"/map.json"); let v=await r.json();
    if(!v){document.getElementById('listMap').innerHTML='Belum ada bangunan admin.';return;}
    let arr = Array.isArray(v) ? v : Object.entries(v).map(([k,val])=>({...val,_key:k}));
    let h='';
    arr.forEach((it,i)=>{
      let key = it._key!=null?it._key:i;
      h+='<div class="item"><div><b>'+(it.nama||it.label||'Bangunan')+'</b><br><small>'+(it.type||'')+' • X: '+it.x+' • Z: '+it.z+'</small></div><button style="background:#dc2626;color:#fff" onclick="hapusMap(\''+key+'\')">HAPUS</button></div>';
    });
    document.getElementById('listMap').innerHTML=h||'Belum ada bangunan.';
  }catch(e){document.getElementById('listMap').innerHTML='Gagal load: '+e;}
}
async function tambahMap(){
  let nama=document.getElementById('namaMap').value.trim();
  let type=document.getElementById('typeMap').value;
  let x=parseFloat(document.getElementById('xMap').value);
  let z=parseFloat(document.getElementById('zMap').value);
  if(!nama){alert('Isi nama dulu!');return;}
  if(isNaN(x)||isNaN(z)){alert('Isi X dan Z!');return;}
  try{
    await fetch(DB_URL+"/map.json",{method:"POST",body:JSON.stringify({nama:nama,type:type,x:x,z:z})});
    alert('✅ Bangunan tersimpan! Refresh game!');
    document.getElementById('namaMap').value='';
    loadMap();
  }catch(e){alert('Gagal simpan! '+e);}
}
async function hapusMap(key){
  if(!confirm('Hapus bangunan ini?'))return;
  try{await fetch(DB_URL+"/map/"+key+".json",{method:"DELETE"});loadMap();}catch(e){alert('Gagal hapus');}
}
// ===== JALAN =====
async function loadJalan(){
  document.getElementById('listJalan').innerHTML='Loading...';
  try{
    let r=await fetch(DB_URL+"/jalan.json"); let v=await r.json();
    if(!v){document.getElementById('listJalan').innerHTML='Belum ada jalan custom. Game pakai jalan default (salib).';return;}
    let arr = Array.isArray(v) ? v : Object.entries(v).map(([k,val])=>({...val,_key:k}));
    let h='';
    arr.forEach((it,i)=>{
      let key = it._key!=null?it._key:i;
      h+='<div class="item"><div><b>🛣️ Jalan '+(i+1)+'</b><br><small>'+(it.arah||'')+' • X: '+it.x+' • Z: '+it.z+' • Panjang: '+it.panjang+' • Lebar: '+it.lebar+'</small></div><div style="display:flex;gap:6px"><button style="background:#f59e0b" onclick="editJalan(\''+key+'\','+it.x+','+it.z+','+it.panjang+','+it.lebar+',\''+it.arah+'\')">EDIT</button><button style="background:#dc2626;color:#fff" onclick="hapusJalan(\''+key+'\')">HAPUS</button></div></div>';
    });
    document.getElementById('listJalan').innerHTML=h||'Belum ada jalan.';
  }catch(e){document.getElementById('listJalan').innerHTML='Gagal load: '+e;}
}
function editJalan(key,x,z,panjang,lebar,arah){
  document.getElementById('xJalan').value=x;
  document.getElementById('zJalan').value=z;
  document.getElementById('panjangJalan').value=panjang;
  document.getElementById('lebarJalan').value=lebar;
  document.getElementById('arahJalan').value=arah;
  window._editJalanKey=key;
  alert('Ke-edit! Ubah angkanya di atas, terus pencet SIMPAN JALAN. Nanti yang lama kehapus, yang baru kesimpan.');
}
async function tambahJalan(){
  let x=parseFloat(document.getElementById('xJalan').value);
  let z=parseFloat(document.getElementById('zJalan').value);
  let panjang=parseFloat(document.getElementById('panjangJalan').value);
  let lebar=parseFloat(document.getElementById('lebarJalan').value);
  let arah=document.getElementById('arahJalan').value;
  if(isNaN(x)||isNaN(z)||isNaN(panjang)||isNaN(lebar)){alert('Isi semua angka dulu!');return;}
  try{
    if(window._editJalanKey){
      await fetch(DB_URL+"/jalan/"+window._editJalanKey+".json",{method:"DELETE"});
      window._editJalanKey=null;
    }
    await fetch(DB_URL+"/jalan.json",{method:"POST",body:JSON.stringify({x:x,z:z,panjang:panjang,lebar:lebar,arah:arah})});
    alert('✅ Jalan tersimpan! Refresh game!');
    loadJalan();
  }catch(e){alert('Gagal simpan! '+e);}
}
async function hapusJalan(key){
  if(!confirm('Hapus jalan ini?'))return;
  try{await fetch(DB_URL+"/jalan/"+key+".json",{method:"DELETE"});loadJalan();}catch(e){alert('Gagal hapus');}
}
async function resetJalan(){
  if(!confirm('Reset jalan ke default salib? Semua jalan custom bakal kehapus!'))return;
  try{
    await fetch(DB_URL+"/jalan.json",{method:"DELETE"});
    await fetch(DB_URL+"/jalan.json",{method:"POST",body:JSON.stringify({x:0,z:0,panjang:500,lebar:10,arah:'horizontal'})});
    await fetch(DB_URL+"/jalan.json",{method:"POST",body:JSON.stringify({x:0,z:0,panjang:500,lebar:10,arah:'vertical'})});
    alert('✅ Reset! Jalan balik jadi salib. Refresh game!');
    loadJalan();
  }catch(e){alert('Gagal reset');}
}
loadMap();
</script>
</body></html>
